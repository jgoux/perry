# CI for the supa/storage fork branch: builds Perry, compiles Supabase Storage
# natively and runs a smoke flow against it. Not part of upstream; drop together
# with .github/supa/ when the fixes land upstream.
name: supa-storage
run-name: supa-storage / ${{ github.sha }}

on:
  push:
    branches: [supa/storage]
  workflow_dispatch:
    inputs:
      storage_ref:
        description: Branch of jgoux/storage to compile
        default: supa/aot-friendly
      regressions:
        description: Run the macOS regression job
        type: boolean
        default: true
      storage:
        description: Run the Linux Storage job
        type: boolean
        default: true

concurrency:
  group: supa-storage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STORAGE_REPO: https://github.com/jgoux/storage
  STORAGE_REF: ${{ inputs.storage_ref || 'supa/aot-friendly' }}

jobs:
  storage-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.storage }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      OUT: ${{ github.workspace }}/supa-out
      STORAGE_DIR: /home/runner/storage
      PERRY_WORKSPACE_ROOT: ${{ github.workspace }}
      PERRY_BUILD_WORKSPACE_ROOT: ${{ github.workspace }}
      PERRY_SRC: ${{ github.workspace }}
      PERRY_RUNTIME_DIR: ${{ github.workspace }}/target/release
      PERRY_BUILD_COMMIT: supa-storage-fork
      PG_PORT: "5432"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          df -h /
          nproc; free -m
          mkdir -p "$OUT"

      - name: Storage environment
        run: |
          .github/supa/env.sh > "$RUNNER_TEMP/storage.env"
          grep -E '^(AUTH_JWT_SECRET|PGRST_JWT_SECRET|SERVICE_KEY|ANON_KEY)=' "$RUNNER_TEMP/storage.env" \
            | cut -d= -f2- | while read -r v; do echo "::add-mask::$v"; done
          cat "$RUNNER_TEMP/storage.env" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npm install -g npm@11
          node --version; npm --version

      - name: Check out Storage
        id: storage
        run: |
          git clone --depth 1 --branch "$STORAGE_REF" "$STORAGE_REPO" "$STORAGE_DIR"
          echo "sha=$(git -C "$STORAGE_DIR" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git -C "$STORAGE_DIR" log --oneline -1

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.arch }}-${{ steps.storage.outputs.sha }}
          restore-keys: npm-${{ runner.arch }}-

      - name: Build Storage
        working-directory: ${{ env.STORAGE_DIR }}
        run: |
          npm ci
          npm run build
          ls dist/start/server-minimal.js

      - name: Tools for the smoke flow
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          command -v /usr/bin/time >/dev/null || sudo apt-get install -y -qq time
          jq --version

      - name: Node reference smoke
        run: |
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -c 'create database ref_node'
          cd "$STORAGE_DIR"
          "$GITHUB_WORKSPACE/.github/supa/serve.sh" start node ref_node 5601 "$OUT" -- node dist/start/server-minimal.js
          "$GITHUB_WORKSPACE/.github/supa/smoke.sh" 5601 "$OUT/node-transcript.txt"
        env:
          NODE_ENV: production
      - name: Stop node reference
        if: always()
        run: .github/supa/serve.sh stop node "$OUT"

      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-04 --profile minimal --component rustfmt --component clippy
      - uses: ./.github/actions/setup-llvm22
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}-supa-storage
          cache-on-failure: true
          save-if: "true"

      - name: Build the Perry compiler and runtime libraries
        run: |
          date +%s > "$OUT/perry-build.start"
          cargo build --locked --release -p perry --bin perry --no-default-features --features compile-cli
          cargo build --locked --release -p perry-runtime-static -p perry-stdlib-static -p perry-ext-http -p perry-ext-net
          date +%s > "$OUT/perry-build.end"
          ls -l target/release/perry
          df -h /

      - name: Object cache id
        id: objid
        # Pins the object-cache build id to the sources that shape generated
        # objects, so runtime-only changes keep hitting the cache.
        run: echo "id=$(echo '${{ hashFiles('crates/perry-codegen/**', 'crates/perry-hir/**', 'crates/perry-transform/**', 'crates/perry-types/**', 'crates/perry/src/**') }}' | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore the object cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORAGE_DIR }}/node_modules/.cache/perry
          key: perry-obj-${{ runner.arch }}-${{ steps.objid.outputs.id }}-${{ steps.storage.outputs.sha }}
          restore-keys: perry-obj-${{ runner.arch }}-${{ steps.objid.outputs.id }}-

      - name: Compile Storage natively
        id: compile
        working-directory: ${{ env.STORAGE_DIR }}
        run: |
          "$GITHUB_WORKSPACE/.github/supa/shims.sh" .
          export PERRY_OBJECT_CACHE_BUILD_ID=${{ steps.objid.outputs.id }}
          export PERRY_NO_AUTO_OPTIMIZE=1 PERRY_FORCE_LINK_RESPONSE_FILE=1 PERRY_KEEP_SYMBOLS=1
          export PERRY_CODEGEN_UNIT_JOBS=2 PERRY_MODULE_JOBS=2
          export PATH="$LLVM_SYS_221_PREFIX/bin:$PATH"
          set +e
          /usr/bin/time -v -o "$OUT/compile.time" \
            "$GITHUB_WORKSPACE/target/release/perry" compile dist/start/server-minimal.js -o "$OUT/storage-native" \
            > "$OUT/compile.log" 2>&1
          rc=$?
          echo "compile exit=$rc" ; tail -n 25 "$OUT/compile.log"
          exit $rc

      - name: Native smoke
        id: native
        run: |
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres -c 'create database ref_native'
          sudo sysctl -w kernel.core_pattern="$OUT/core.%p" || true
          cd "$STORAGE_DIR"
          "$GITHUB_WORKSPACE/.github/supa/serve.sh" start native ref_native 5611 "$OUT" -- "$OUT/storage-native"
          pid=$(cat "$OUT/native.pid")
          sleep 5
          grep -E 'VmRSS|VmHWM' "/proc/$pid/status" | tee "$OUT/native-idle-rss.txt"
          "$GITHUB_WORKSPACE/.github/supa/smoke.sh" 5611 "$OUT/native-transcript.txt"
      - name: Stop native
        if: always()
        run: .github/supa/serve.sh stop native "$OUT"

      - name: Compare with node
        run: .github/supa/compare.sh "$OUT/node-transcript.txt" "$OUT/native-transcript.txt"

      - name: Diagnostics
        if: failure()
        run: .github/supa/diagnose.sh "$OUT/storage-native" "$OUT/diagnostics" || true

      - name: Job summary
        if: always()
        run: |
          {
            echo "### storage-linux"
            echo "- perry: \`${GITHUB_SHA::8}\`, storage: \`${{ steps.storage.outputs.sha }}\` (\`$STORAGE_REF\`)"
            if [ -f "$OUT/perry-build.end" ]; then
              echo "- perry build (compiler + libs): $(( $(cat "$OUT/perry-build.end") - $(cat "$OUT/perry-build.start") )) s"
            fi
            if [ -f "$OUT/compile.time" ]; then
              grep -E 'Elapsed|Maximum resident' "$OUT/compile.time" | sed 's/^\s*/- compile: /'
            fi
            if [ -f "$OUT/storage-native" ]; then
              echo "- binary: $(stat -c %s "$OUT/storage-native") bytes unstripped, $(strip -o /dev/stdout "$OUT/storage-native" 2>/dev/null | wc -c) bytes stripped"
            fi
            [ -f "$OUT/native-idle-rss.txt" ] && sed 's/^/- idle /' "$OUT/native-idle-rss.txt"
            echo '```'
            [ -f "$OUT/native-transcript.txt" ] && cat "$OUT/native-transcript.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-linux-logs
          path: |
            supa-out/*.log
            supa-out/*.txt
            supa-out/*.time
            supa-out/diagnostics
            !supa-out/diagnostics/native-binary.gz
          if-no-files-found: ignore
      - name: Upload binary and diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storage-linux-failure
          path: |
            supa-out/diagnostics
            supa-out/core.*
          if-no-files-found: ignore
          retention-days: 7

  regressions-macos:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.regressions }}
    runs-on: macos-15
    timeout-minutes: 240
    env:
      PERRY_WORKSPACE_ROOT: ${{ github.workspace }}
      PERRY_BUILD_WORKSPACE_ROOT: ${{ github.workspace }}
      PERRY_SRC: ${{ github.workspace }}
      PERRY_RUNTIME_DIR: ${{ github.workspace }}/target/release
      PERRY_BUILD_COMMIT: supa-storage-fork
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-04 --profile minimal --component rustfmt --component clippy
      - uses: ./.github/actions/setup-llvm22
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}-supa-regressions
          cache-on-failure: true
          save-if: "true"
      - name: Runtime libraries for the integration tests
        run: cargo build --locked --release -p perry-runtime-static -p perry-stdlib-static -p perry-ext-http -p perry-ext-net
      - name: Compiler integration regressions
        run: |
          cargo test --locked --release -p perry --no-default-features --features compile-cli \
            --test cjs_class_method_sees_later_const \
            --test class_computed_member_before_super_method \
            --test codegen_units_shared_helper_linkage \
            --test image_string_literal_native_args \
            --test layout_family_alias_stack_map \
            --test url_search_params_type_erased_methods \
            --test worker_program_regex_literal
      - name: HIR regressions
        run: cargo test --locked --release -p perry-hir --test cjs_factory_frame_label --test enum_as_value_lowering
      - name: Runtime unit regressions
        run: |
          RUST_TEST_THREADS=1 cargo test --locked --release -p perry-runtime --lib -- \
            a_module_body_frame_renders_its_own_location tracked_classifier_rejects_null_forged_and_image_edge_addresses
      - name: Codegen unit regressions
        # Exact names: other perry-codegen lib tests abort on this baseline.
        run: |
          cargo test --locked --release -p perry-codegen --lib -- \
            the_cap_does_not_count_groups_that_never_walk \
            the_cap_counts_root_loads_not_derived_values \
            the_hot_cache_read_is_marked_gc_leaf_in_bodies_without_root_slots
