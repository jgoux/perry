[package]
name = "perry-runtime-static"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Staticlib wrapper (#5422): emits libperry_runtime.a from the rlib-only perry-runtime crate"

# Emits the C-ABI static archive consumed by `perry compile`'s linker. The
# output name stays `perry_runtime` so the produced archive is the canonical
# `libperry_runtime.a` / `perry_runtime.lib` every consumer already looks for —
# only the cargo PACKAGE name (`-p perry-runtime-static`) changes.
[lints]
workspace = true

[lib]
name = "perry_runtime"
crate-type = ["staticlib"]
path = "src/lib.rs"

[features]
# A plain `cargo build -p perry-runtime-static` reproduces today's full
# `cargo build -p perry-runtime` archive. The auto-optimize path instead builds
# with `--no-default-features --features perry-runtime/<subset>` (cargo accepts
# the `dep/feature` form because perry-runtime is in this crate's dependency
# graph), so no per-feature forwarding is needed here.
default = ["perry-runtime/default"]
# wasip1 only: fold perry-stdlib and every extension crate Supabase Storage's
# native link pulls in into this one archive, under one allocator.
# `scripts/wasi_build_runtime.py` turns it on for `wasm32-wasip1` together with
# the perry-stdlib features Storage selects. Native and wasip2 builds leave it
# off, so they do not compile the extra crates.
wasi-node-modules = [
    "dep:perry-stdlib",
    "dep:perry-ext-http",
    "dep:perry-http-server",
    "dep:perry-ext-undici",
    "dep:perry-ext-zlib",
    "dep:perry-ext-ws",
]

[dependencies]
# default-features = false so `--no-default-features` on this wrapper actually
# strips perry-runtime down to the auto-optimize subset; without it the dep edge
# would drag perry-runtime's defaults back on (cf. the root Cargo.toml note).
perry-runtime = { path = "../perry-runtime", default-features = false }

[target.'cfg(target_os = "wasi")'.dependencies]
# Bundle the existing net binding into the WASI archive. Independently built
# Rust staticlibs both define allocator shims; one staticlib keeps a single
# allocator and a single copy of std without permitting duplicate symbols.
perry-ext-net = { path = "../perry-ext-net" }
perry-stdlib = { path = "../perry-stdlib", default-features = false, optional = true }
perry-ext-http = { path = "../perry-ext-http", optional = true }
perry-http-server = { path = "../perry-http-server", optional = true }
perry-ext-undici = { path = "../perry-ext-undici", optional = true }
perry-ext-zlib = { path = "../perry-ext-zlib", optional = true }
perry-ext-ws = { path = "../perry-ext-ws", optional = true }
